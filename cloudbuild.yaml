# ==============================================================================
# 🚨 ARCHIVO DE INFRAESTRUCTURA AUDITADO - OBSERVATORIO AECCO LAB 🚨
# ==============================================================================
# REGLAS DE ORO: 
# 1. No tatuar variables. 2. No modificar sin permiso. 3. Solo 'git push'.
# ==============================================================================

steps:
  # ============================
  # 🔹 1. BACKEND: CONSTRUCCIÓN
  # ============================
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/Dockerfile
      - --tag=${_BACKEND_IMAGE}:${SHORT_SHA}
      - --tag=${_BACKEND_IMAGE}:latest
      - backend

  - id: push-backend-short-sha
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_BACKEND_IMAGE}:${SHORT_SHA}']

  # ============================
  # 🔹 2. BACKEND: DESPLIEGUE
  # ============================
  - id: deploy-backend
    name: gcr.io/cloud-builders/gcloud
    waitFor: ['push-backend-short-sha']
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_BACKEND_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --quiet

  # ============================
  # 🔹 3. FRONTEND: CONSTRUCCIÓN (CON 6 LLAVES DE FIREBASE)
  # ============================
  # Inyección de variables de entorno requeridas por Next.js para el Build.
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - --file=frontend/Dockerfile
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      # 🔐 CONFIGURACIÓN COMPLETA DE FIREBASE (AUDITADA)
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --tag=${_FRONTEND_IMAGE}:${SHORT_SHA}
      - --tag=${_FRONTEND_IMAGE}:latest
      - frontend

  - id: push-frontend-short-sha
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_FRONTEND_IMAGE}:${SHORT_SHA}']

  # ============================
  # 🔹 4. FRONTEND: DESPLIEGUE
  # ============================
  - id: deploy-frontend
    name: gcr.io/cloud-builders/gcloud
    waitFor: ['push-frontend-short-sha']
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_FRONTEND_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --quiet

substitutions:
  _REGION: europe-southwest1
  _AR_REPO: europe-southwest1-docker.pkg.dev/${PROJECT_ID}/repo-observatorio-dev
  _BACKEND_IMAGE: ${_AR_REPO}/backend
  _FRONTEND_IMAGE: ${_AR_REPO}/frontend

images:
  - ${_BACKEND_IMAGE}:${SHORT_SHA}
  - ${_BACKEND_IMAGE}:latest
  - ${_FRONTEND_IMAGE}:${SHORT_SHA}
  - ${_FRONTEND_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
